

<div class="container-fluid px-4 pb-5">

    <div class="row mb-4">
        <div class="col-12">
            <div class="card p-3 d-flex flex-row align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3 w-100">
                    <label class="text-nowrap fw-bold">انتخاب فهرست برای ویرایش:</label>
                    <select class="form-select w-auto" style="min-width: 200px;">
                        <option selected>منوی اصلی (Primary Menu)</option>
                        <option value="1">منوی فوتر</option>
                        <option value="2">منوی موبایل</option>
                    </select>
                    <button class="btn btn-outline-primary btn-sm">گزینش</button>
                    <span class="text-muted small ms-2">یا <a href="#" class="text-decoration-none">ساخت فهرست جدید</a></span>
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <div class="col-lg-3 mb-4">
            <h5 class="mb-3 fw-bold text-secondary">افزودن گزینه‌های فهرست</h5>

            <div class="accordion" id="accordionPanels">

                <div class="accordion-item shadow-sm">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panels-pages">
                            برگه‌ها
                        </button>
                    </h2>
                    <div id="panels-pages" class="accordion-collapse collapse show" data-bs-parent="#accordionPanels">
                        <div class="accordion-body">
                            <ul class="list-unstyled mb-3" id="page-list">
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="صفحه اصلی" id="page1">
                                    <label class="form-check-label" for="page1">صفحه اصلی</label>
                                </li>
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="فروشگاه" id="page2">
                                    <label class="form-check-label" for="page2">فروشگاه</label>
                                </li>
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="حساب کاربری" id="page3">
                                    <label class="form-check-label" for="page3">حساب کاربری</label>
                                </li>
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="تماس با ما" id="page4">
                                    <label class="form-check-label" for="page4">تماس با ما</label>
                                </li>
                            </ul>
                            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="selectAllPages">
                                    <label class="form-check-label small" for="selectAllPages">همه</label>
                                </div>
                                <button class="btn btn-primary btn-sm btn-add-menu" onclick="addSelectedItems('page-list', 'برگه')">افزودن به فهرست</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion-item shadow-sm">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panels-posts">
                            نوشته‌ها
                        </button>
                    </h2>
                    <div id="panels-posts" class="accordion-collapse collapse" data-bs-parent="#accordionPanels">
                        <div class="accordion-body">
                            <ul class="list-unstyled mb-3" id="post-list">
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="سلام دنیا!" id="post1">
                                    <label class="form-check-label" for="post1">سلام دنیا!</label>
                                </li>
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="چگونه وردپرس یاد بگیریم" id="post2">
                                    <label class="form-check-label" for="post2">چگونه وردپرس یاد بگیریم</label>
                                </li>
                            </ul>
                            <div class="text-end border-top pt-2">
                                <button class="btn btn-primary btn-sm btn-add-menu" onclick="addSelectedItems('post-list', 'نوشته')">افزودن به فهرست</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion-item shadow-sm">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panels-links">
                            پیوندهای دلخواه
                        </button>
                    </h2>
                    <div id="panels-links" class="accordion-collapse collapse" data-bs-parent="#accordionPanels">
                        <div class="accordion-body">
                            <div class="mb-2">
                                <label class="form-label small">نشانی اینترنتی</label>
                                <input type="text" class="form-control form-control-sm" placeholder="https://..." id="custom-link-url">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small">متن پیوند</label>
                                <input type="text" class="form-control form-control-sm" placeholder="مثلا: گوگل" id="custom-link-text">
                            </div>
                            <div class="text-end">
                                <button class="btn btn-primary btn-sm btn-add-menu" onclick="addCustomLink()">افزودن به فهرست</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion-item shadow-sm">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panels-cats">
                            دسته‌ها
                        </button>
                    </h2>
                    <div id="panels-cats" class="accordion-collapse collapse" data-bs-parent="#accordionPanels">
                        <div class="accordion-body">
                            <ul class="list-unstyled mb-3" id="cat-list">
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="تکنولوژی" id="cat1">
                                    <label class="form-check-label" for="cat1">تکنولوژی</label>
                                </li>
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="اخبار" id="cat2">
                                    <label class="form-check-label" for="cat2">اخبار</label>
                                </li>
                                <li class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="آموزشی" id="cat3">
                                    <label class="form-check-label" for="cat3">آموزشی</label>
                                </li>
                            </ul>
                            <div class="text-end border-top pt-2">
                                <button class="btn btn-primary btn-sm btn-add-menu" onclick="addSelectedItems('cat-list', 'دسته')">افزودن به فهرست</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="col-lg-9">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>ساختار فهرست</span>
                    <div class="input-group input-group-sm w-auto">
                        <span class="input-group-text bg-light">نام فهرست</span>
                        <input type="text" class="form-control" value="منوی اصلی">
                    </div>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-4">
                        <i class="fas fa-info-circle me-1"></i>
                        آیتم‌ها را بکشید و رها کنید. برای تنظیمات بیشتر روی فلش کلیک کنید. از دکمه‌های «زیرمجموعه» برای ایجاد تو رفتگی استفاده کنید.
                    </p>

                    <ul id="menu-structure">
                        <li class="empty-placeholder" id="empty-msg">
                            <i class="fas fa-layer-group fa-3x mb-3"></i>
                            <p>آیتم‌های فهرست را از ستون راست اضافه کنید.</p>
                        </li>
                    </ul>
                </div>

                <div class="menu-footer rounded-bottom-3">
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="auto-add">
                            <label class="form-check-label small" for="auto-add">افزودن خودکار برگه‌ها</label>
                        </div>
                        <div class="d-block mt-2">
                            <span class="small fw-bold ms-2">مکان نمایش:</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loc-primary" checked>
                                <label class="form-check-label small" for="loc-primary">منوی اصلی</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="loc-mobile">
                                <label class="form-check-label small" for="loc-mobile">منوی موبایل</label>
                            </div>
                        </div>
                    </div>
                    <div>
                        <a href="#" class="text-danger small text-decoration-none me-3">پاک کردن فهرست</a>
                        <button class="btn btn-primary px-4">ذخیره فهرست</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    // شمارنده ID برای یکتایی
    let itemIdCounter = 10;

    // فعال‌سازی SortableJS
    const menuStructure = document.getElementById('menu-structure');
    new Sortable(menuStructure, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        handle: '.menu-item-header', // فقط هدر قابل درگ است
        onEnd: function (evt) {
            checkEmptyState();
        }
    });

    // بررسی خالی بودن لیست
    function checkEmptyState() {
        const items = document.querySelectorAll('.menu-item-card');
        const emptyMsg = document.getElementById('empty-msg');
        if (items.length > 0) {
            emptyMsg.style.display = 'none';
        } else {
            emptyMsg.style.display = 'block';
        }
    }

    // تابع افزودن آیتم‌های انتخاب شده
    function addSelectedItems(containerId, typeLabel) {
        const container = document.getElementById(containerId);
        const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');

        checkboxes.forEach(chk => {
            createMenuItem(chk.value, typeLabel);
            chk.checked = false;
        });
        checkEmptyState();
    }

    // تابع افزودن لینک دلخواه
    function addCustomLink() {
        const textInput = document.getElementById('custom-link-text');
        const urlInput = document.getElementById('custom-link-url');

        if(textInput.value.trim() !== "") {
            createMenuItem(textInput.value, 'پیوند دلخواه', urlInput.value);
            textInput.value = '';
            urlInput.value = '';
            checkEmptyState();
        } else {
            alert("لطفا متن پیوند را وارد کنید");
        }
    }

    // --- ساخت HTML پیشرفته آیتم (با قابلیت باز شدن و تو رفتگی) ---
    function createMenuItem(title, type, url = '#') {
        const id = itemIdCounter++;
        const li = document.createElement('li');
        li.className = 'menu-item-card depth-0'; // پیش‌فرض سطح 0
        li.id = `menu-item-${id}`;

        li.innerHTML = `
                <div class="menu-item-header">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-grip-vertical text-muted me-3" style="cursor: grab;"></i>
                        <span class="menu-item-title" id="lbl-${id}">${title}</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="menu-item-type">${type}</span>
                        <button class="toggle-btn" onclick="toggleEdit('${id}')">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                </div>

                <div class="menu-item-settings">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small text-muted">نشانی (URL)</label>
                            <input type="text" class="form-control form-control-sm bg-light" value="${url}" dir="ltr">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-muted">متن ناوبری</label>
                            <input type="text" class="form-control form-control-sm" value="${title}" oninput="updateLabel('${id}', this.value)">
                        </div>
                        <div class="col-md-6">
                             <label class="form-label small text-muted">ساختار</label>
                             <div class="btn-group w-100" role="group">
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="changeDepth('${id}', -1)">
                                    <i class="fas fa-outdent"></i> اصلی
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="changeDepth('${id}', 1)">
                                    <i class="fas fa-indent"></i> زیرمجموعه
                                </button>
                            </div>
                        </div>
                        <div class="col-12 border-top pt-2 mt-2 d-flex justify-content-between">
                             <a href="#" class="text-danger small text-decoration-none" onclick="removeElement('${id}')">حذف از فهرست</a>
                             <a href="#" class="text-secondary small text-decoration-none" onclick="toggleEdit('${id}')">بستن</a>
                        </div>
                    </div>
                </div>
            `;

        // انیمیشن ورود
        li.style.opacity = 0;
        document.getElementById('menu-structure').appendChild(li);
        setTimeout(() => { li.style.opacity = 1; }, 10);
    }

    // باز و بسته کردن پنل تنظیمات
    function toggleEdit(id) {
        const item = document.getElementById(`menu-item-${id}`);
        const settings = $(item).find('.menu-item-settings');

        settings.slideToggle(200); // استفاده از jQuery برای نرم بودن
        item.classList.toggle('is-open');
    }

    // آپدیت متن هدر هنگام تایپ
    function updateLabel(id, value) {
        document.getElementById(`lbl-${id}`).innerText = value;
    }

    // تغییر عمق (تو رفتگی)
    function changeDepth(id, dir) {
        const item = document.getElementById(`menu-item-${id}`);
        let currentDepth = 0;

        if (item.classList.contains('depth-1')) currentDepth = 1;
        if (item.classList.contains('depth-2')) currentDepth = 2;

        let newDepth = currentDepth + dir;
        if (newDepth < 0) newDepth = 0;
        if (newDepth > 2) newDepth = 2;

        item.classList.remove('depth-0', 'depth-1', 'depth-2');
        item.classList.add(`depth-${newDepth}`);
    }

    // حذف آیتم
    function removeElement(id) {
        if(confirm('آیا مطمئن هستید؟')) {
            const item = document.getElementById(`menu-item-${id}`);
            $(item).slideUp(200, function() {
                item.remove();
                checkEmptyState();
            });
        }
    }

    // اضافه کردن چند آیتم پیش‌فرض برای دمو
    createMenuItem('صفحه اصلی', 'برگه', '/');
    createMenuItem('فروشگاه', 'برگه', '/shop');

</script>
